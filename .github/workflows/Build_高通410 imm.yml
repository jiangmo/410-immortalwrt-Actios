#
#

name: 🚀 Build_imm_高通410系列

defaults:
  run:
    shell: bash

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 指定 hash（默认不用填写）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  BUILD_VERSION: '1.0.4'
  PROFILE: ${{ inputs.profile || 'ufi003' }}
  REPO_URL: https://github.com/${{ inputs.upstream || 'lkiuyu/immortalwrt' }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', inputs.profile || 'ufi003') }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
    - name: 🚀 编译 (Build)
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        bash scripts/install-dependencies.sh

    - name: mkbootimg build
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 验证安装
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
        echo "mkbootimg found at: $MKBOOTIMG_PATH"
        file "$MKBOOTIMG_PATH"
        else
        echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT
        
    - name: Ensure Python build tools
      run: |
       python3 -m pip cache purge
       python3 -m pip install --upgrade --force-reinstall pip
       python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
       python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
       python3 -m pip install --upgrade cython packaging tomli
       python3 -m pip install Unidecode pyelftools
       python3 -m pip --version
       python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"



    - name: 读取锁定的上游 hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "使用锁定 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 不存在，使用最新 master"
        fi

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt


    - name: Copy overlay files
      run: |
        mkdir -p openwrt/files
        cp -a files/. openwrt/files/

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a 2>&1 | tee feeds-update.log
        if grep -q 'ERROR: please fix' feeds-update.log; then
          find logs/feeds -name dump.txt -type f -print -exec cat {} \;
          exit 1
        fi
        for feed in feeds/*; do
          if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
            printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          fi
        done | tee feeds-revisions.txt

    - name: Remove conflicting packages from smpackage
      run: |
        # 删除 small-package 中与系统冲突的包，避免编译报错（官方推荐操作）
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        test -f "$CONFIG_FILE"
        cp "$CONFIG_FILE" openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install extra packages
      env:
        EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      run: |
        cd openwrt
        python3 "$GITHUB_WORKSPACE/scripts/package-selection.py" prepare --packages "$EXTRA_PACKAGES"
        
        
    - name: Config defconfig
      id: config
      run: |
       cd openwrt
       make defconfig 2>&1 | tee config.log

    - name: Verify selected packages after defconfig
      run: |
        cd openwrt
        python3 "$GITHUB_WORKSPACE/scripts/package-selection.py" check-config
       
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j4 V=s 2>&1 | tee download.log
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 查看实际编译配置
      run: |
        ls -la openwrt/
        ls -l openwrt/.config
        grep '^CONFIG_TARGET.*=y' openwrt/.config

 
    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
         ${{ github.workspace }}/openwrt/feeds-revisions.txt
         ${{ github.workspace }}/openwrt/custom-package-revisions.txt
         ${{ github.workspace }}/openwrt/package-selection.json
         ${{ github.workspace }}/openwrt/package-selection-report.txt
         ${{ github.workspace }}/custom-packages.lock
         ${{ github.workspace }}/VERSION
       include-hidden-files: true


    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify packages in firmware manifest
      run: |
        cd openwrt
        python3 "$GITHUB_WORKSPACE/scripts/package-selection.py" check-manifest --manifest bin/targets/*/*/*.manifest

    - name: Get kernel version
      run: |
        KERNEL_VER=$(awk '$1 == "kernel" && $2 == "-" {split($3, parts, "~"); print parts[1]; exit}' openwrt/bin/targets/*/*/*.manifest)
        KERNEL_VER=${KERNEL_VER:-未知}
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Fix Git buffer
      run: git config --global http.postBuffer 524288000

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 允许只存在压缩或未压缩镜像，避免 ls 缺失通配符导致 pipefail。
        shopt -s nullglob
        BOOT_IMAGES=( *boot.img.gz *boot.img )
        SYSTEM_IMAGES=( *system.img.gz *system.img )
        BOOT_IMG=${BOOT_IMAGES[0]:-}
        SYSTEM_IMG=${SYSTEM_IMAGES[0]:-}
        mkdir -p flash_package
        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::固件文件未找到，编译可能失败！当前目录文件："
          ls -la
          exit 1
        fi
        for kind in boot system; do
          if [ "$kind" = boot ]; then image="$BOOT_IMG"; else image="$SYSTEM_IMG"; fi
          if [[ "$image" == *.gz ]]; then
            gzip -dc "$image" > "flash_package/$kind.img"
          else
            cp "$image" "flash_package/$kind.img"
          fi
        done
        cp -r $GITHUB_WORKSPACE/刷机脚本/. flash_package/
        # 确保 bat 文件是 CRLF 换行（Windows 兼容）
        sed -i 's/\r$//; s/$/\r/' flash_package/*.bat
        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_刷机包.zip"
        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 整理 release 目录：zip + 单独固件 + 编译信息
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true
        cp "$GITHUB_WORKSPACE/openwrt/package-selection.json" release_files/
        cp "$GITHUB_WORKSPACE/openwrt/package-selection-report.txt" release_files/
        cp "$GITHUB_WORKSPACE/openwrt/package-manifest-report.txt" release_files/
        cp "$GITHUB_WORKSPACE/openwrt/custom-package-revisions.txt" release_files/
        cp "$GITHUB_WORKSPACE/openwrt/feeds-revisions.txt" release_files/

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "工作流版本: $BUILD_VERSION"
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master分支 高通410系列 · ${PROFILE}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 工作流版本 | $BUILD_VERSION |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | 192.168.1.1 |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空 |"
          echo ""
          python3 "$GITHUB_WORKSPACE/scripts/package-selection.py" release --state openwrt/package-selection.json
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT



    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Upload build diagnostics
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: build-diagnostics-${{ github.run_id }}
        if-no-files-found: ignore
        include-hidden-files: true
        path: |
          openwrt/feeds-update.log
          openwrt/feeds-revisions.txt
          openwrt/custom-package-revisions.txt
          openwrt/package-selection.json
          openwrt/package-selection-report.txt
          openwrt/package-manifest-report.txt
          openwrt/build.log
          openwrt/config.log
          openwrt/download.log
          openwrt/logs/
          openwrt/.config
          openwrt/tmp/.config-package.in
          openwrt/tmp/.config-feeds.in
          openwrt/tmp/.packageinfo
          openwrt/feeds.conf.default
          custom-packages.lock
          VERSION
